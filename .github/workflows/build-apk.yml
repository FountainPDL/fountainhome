name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci   # Clean install using package-lock.json

      - name: Build web app (Vite)
        run: npm run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Capacitor & Build APK
        run: |
          npm install -g @capacitor/cli
          npx cap sync android || (npx cap init --web-dir dist && npx cap add android && npx cap sync android)
          
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fountainhome-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
