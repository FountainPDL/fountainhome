name: Build APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (npm)
        run: npm install

      - name: Run linter
        run: npm run lint --max-warnings 0 || true

      - name: Build web (Vite)
        run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: '35.0.0'

      - name: Install Capacitor CLI (fallback)
        run: |
          # prefer local npx, but install global CLI as fallback to avoid failures
          npm install -g @capacitor/cli@5 || true

      - name: Create Capacitor project (if needed)
        run: |
          # Initialize capacitor config only if missing; set web-dir to Vite output (dist)
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Fountain Home" com.fountainstream.app --web-dir=dist
          else
            echo "capacitor.config.json already exists; skipping cap init"
          fi

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android platform already present; skipping cap add"
          fi

      - name: Copy web assets to native projects
        run: |
          # Ensure the built Vite output (dist) is copied into the native Android project
          npx cap copy android

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew || true

      - name: Configure Android signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/build.keystore
          # Create a local.properties with the SDK path and sensible gradle JVM args
          cat > android/local.properties <<-EOF
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Build APK (Debug)
        if: github.event.inputs.release_type == 'debug' || github.event_name != 'workflow_dispatch'
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Build APK (Release)
        if: github.event.inputs.release_type == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew clean
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/build.keystore \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=fountain_app \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Upload APK artifact (Debug)
        if: success() && (github.event.inputs.release_type == 'debug' || github.event_name != 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: fountain-home-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Bundle artifact (Release)
        if: success() && github.event.inputs.release_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: fountain-home-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create Release
        if: success() && github.event.inputs.release_type == 'release'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            APK Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload to Play Store (Optional)
        if: false  # Set to true with proper credentials
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_KEY }}
          packageName: com.fountainstream.app
          releaseFiles: 'android/app/build/outputs/bundle/release/*.aab'
          track: internal
          status: inProgress
