name: Build APK

on:
  push:
    branches:
      - main
      - fix/ci-build-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli

      - name: Init Capacitor (if needed)
        run: npx cap init FountainHome com.fountain.home || true

      - name: Add Android
        run: npx cap add android || true

      - name: Copy build to Android
        run: npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
